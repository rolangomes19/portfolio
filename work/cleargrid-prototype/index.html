<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClearGrid — Borrower Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFF; --sunken:#EDEFF2; --nav:#14161A;
  --text:#0A0A08; --text2:#5B6166; --muted:#8A9094;
  --line:#E5E7E9; --line2:#D3D7DA; --line-soft:#EEF0F2;
  /* control boundaries. --btnline is decorative (the label identifies a button);
     --ctl is an input's only boundary, so it clears WCAG 1.4.11's 3:1 on white. */
  --btnline:#C4C9CD; --ctl:#8A9094;
  --teal:#069494; --tealDeep:#04716D; --tealDeeper:#035854; --tealWash:#EAF5F5;
  --coral:#DC4A3E; --coralDeep:#B23A30; --coralWash:#FDEEEC;
  --green:#1E8E5A; --greenWash:#E9F5EF; --amber:#B8790A; --amberWash:#FBF2E0;
  /* -Text pairs: the base hues are 3:1-only (dots, bars, fills). Text on a wash uses
     these, each measured ≥5:1 on its own wash. The old pairs measured 3.99–4.05:1. */
  --coralText:#B8342A; --greenText:#17744A; --amberText:#8A5A06;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --ar:'Tajawal','IBM Plex Sans Arabic','Noto Sans Arabic',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  /* type: four sizes, each with one job. meta 12 · body 13 · title 16 · display 24. */
  --fs-meta:12px; --fs-body:13px; --fs-title:16px; --fs-display:24px;
  --lh-meta:16px; --lh-body:20px; --lh-title:24px; --lh-display:28px;
  /* space: 4px grid. nothing between the steps. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px;
  --r-sm:4px; --r-md:6px;
  --shadow-sm:0 1px 2px rgba(16,24,28,.08);
  --shadow-md:0 4px 12px rgba(16,24,28,.12);
  --focus-ring:0 0 0 2px var(--surface),0 0 0 4px var(--teal);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--fs-body);line-height:var(--lh-body);overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
b,strong{font-weight:600}

/* Arabic: real font, ×1.7 leading on every text tier, zero tracking on anything with Arabic glyphs */
html[lang="ar"]{--lh-meta:1.7; --lh-body:1.7; --lh-title:1.7}
html[lang="ar"] body{font-family:var(--ar)}
html[lang="ar"] *{letter-spacing:normal!important;font-style:normal!important;text-transform:none!important}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;max-inline-size:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* type tiers — display / title / emphasis / label. everything on screen is one of these
   sizes; a new need is a modifier (mono, muted), never a new size. weights 400/600 only,
   plus 500 on mono display (JetBrains Mono ships no 600 file). */
.t-display{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-display);line-height:var(--lh-display);font-weight:500;letter-spacing:-.01em}
.t-display.sm{font-size:var(--fs-title);line-height:24px}
.t-title{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;letter-spacing:-.01em}
.t-pri{font-size:var(--fs-body);font-weight:600}
.t-sec,.eyebrow{font-size:var(--fs-meta);line-height:var(--lh-meta);font-weight:400;color:var(--text2)}
html[lang="ar"] .eyebrow{font-family:var(--ar)}
/* .empty stays on --muted: CLAUDE.md's null glyph must look quieter than data. */
.dim{color:var(--text2)} .empty{color:var(--muted)}

/* ── shared interaction states ── */
.nav-promo-btn,.nav-lang button,.act,.mini,.qrow{transition:transform 120ms cubic-bezier(.23,1,.32,1)}
.nav-promo-btn:active,.nav-lang button:active,.act:active,.mini:active,.qrow:active{transform:scale(.97)}
.act:focus-visible,.mini:focus-visible,.card:focus-visible,.qrow:focus-visible,.nav-promo-btn:focus-visible,
.tabs button:focus-visible,.nav-lang button:focus-visible,.nav .item:focus-visible,.nav-foot button:focus-visible{
  outline:none;box-shadow:var(--focus-ring)}

/* ── buttons: two sizes, one shape. md 32/13 (rail, wrap-up), sm 28/12 (column heads, rows).
   label centred, never stretched: width comes from padding, not a min-width. ── */
.act,.mini{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap;
  font:inherit;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--btnline);
  border-radius:var(--r-md);padding:0 var(--s3);cursor:pointer}
.act{block-size:32px;font-size:var(--fs-body)}
.act .icon{font-size:16px}
.mini{block-size:28px;font-size:var(--fs-meta);gap:var(--s1)}
.act.primary,.mini.pri{background:var(--tealDeep);border-color:var(--tealDeep);color:#fff}
.act.off{background:var(--sunken);color:var(--text2);cursor:not-allowed}
.act.off:active{transform:none}
/* hover: every control answers the pointer. secondary darkens its edge and fill,
   primary deepens, a disabled one only shows its tooltip. */
.act:not(.off):hover,.mini:not(.pri):hover,.dd-trigger:hover{background:var(--bg);border-color:var(--ctl)}
.act.primary:hover,.mini.pri:hover,.qrow:hover .mini.pri{background:var(--tealDeeper);border-color:var(--tealDeeper)}
.tabs button:not(.on):hover{color:var(--text);background:rgba(255,255,255,.55)}
.nav-lang button:not(.on):hover{opacity:1;background:rgba(255,255,255,.08)}
.nav-promo-btn:hover{background:var(--line)}
tbody tr:hover .mini{border-color:var(--ctl)}

/* tooltip: plain-language reason on a disabled control, on hover and keyboard focus.
   start-aligned under the control; logical insets so it sits right in RTL too. */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:80;
  inset-block-start:calc(100% + var(--s2));inset-inline-start:0;inline-size:max-content;max-inline-size:240px;
  padding:var(--s1) var(--s2);border-radius:var(--r-sm);background:var(--nav);color:#fff;box-shadow:var(--shadow-md);
  font-size:var(--fs-meta);line-height:var(--lh-meta);font-weight:400;text-align:start;white-space:normal;pointer-events:none}

/* ── frame ─────────────────────────────────────────────────────── */
.app{height:100%;display:flex;min-height:0}
.nav{inline-size:184px;flex:0 0 184px;background:var(--nav);color:#fff;overflow:hidden;display:flex;flex-direction:column}
.nav-scroll{flex:1;min-height:0;overflow:auto;padding:var(--s4) var(--s2)}
.nav-bottom{flex:0 0 auto;border-block-start:1px solid rgba(255,255,255,.1);padding:var(--s2)}
.nav-foot{flex:0 0 auto;border-block-start:1px solid rgba(255,255,255,.1);padding:var(--s1) var(--s2)}
.nav .logo{display:flex;align-items:center;block-size:32px;padding:0 var(--s2);margin-block-end:var(--s4)}
.logo-full{block-size:32px;inline-size:auto;display:block}
.logo-mark{inline-size:32px;block-size:32px;display:none}
.nav .gl{font-size:var(--fs-meta);line-height:var(--lh-meta);opacity:.5;margin:var(--s4) var(--s2) var(--s1)}
.nav .item{display:flex;align-items:center;gap:var(--s2);block-size:32px;padding:0 var(--s2);border-radius:var(--r-md);
  opacity:.75;cursor:pointer}
.nav .item:hover{opacity:1;background:rgba(255,255,255,.06)}
.nav .item.on{background:rgba(6,148,148,.22);opacity:1;font-weight:600}
.nav .item .icon{font-size:16px}
.nav-promo{background:rgba(255,255,255,.06);border-radius:var(--r-md);padding:var(--s3);margin-block-end:var(--s2)}
.nav-promo .t-sec{color:rgba(255,255,255,.7)}
.nav-promo-btn{margin-block-start:var(--s2);display:inline-flex;align-items:center;gap:var(--s1);background:#fff;color:var(--nav);
  border:0;border-radius:var(--r-md);block-size:28px;padding:0 var(--s3);font:inherit;font-size:var(--fs-meta);font-weight:600;cursor:pointer}
.nav-profile{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 0}
.nav-profile .avatar{inline-size:24px;block-size:24px;background:var(--teal);color:#fff;font-size:var(--fs-meta)}
.nav-profile .who{display:flex;flex-direction:column;min-width:0;flex:1}
.nav-profile .who .t-pri,.nav-profile .who .t-sec{color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-profile .who .t-sec{color:rgba(255,255,255,.6)}
.nav-profile .icon{opacity:.6}
.nav-foot button{inline-size:100%;block-size:32px;background:transparent;border:0;color:#fff;opacity:.7;
  border-radius:var(--r-md);cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav-foot button:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav.collapsed .nav-foot .icon{transform:scaleX(-1)}
html[dir="rtl"] .nav-foot .icon{transform:scaleX(-1)}
html[dir="rtl"] .nav.collapsed .nav-foot .icon{transform:scaleX(1)}
.nav-lang{display:flex;background:rgba(255,255,255,.09);border-radius:var(--r-md);padding:2px;gap:2px;margin-block-end:var(--s2)}
.nav-lang button{flex:1;border:0;padding:0;background:transparent;color:#fff;opacity:.75;font:inherit;font-size:var(--fs-meta);
  block-size:28px;border-radius:var(--r-sm);cursor:pointer}
.nav-lang button.on{background:#fff;color:var(--nav);opacity:1;font-weight:600}
.nav-lang button[data-v="ar"]{font-family:var(--ar)}
.nav-lang .ic{display:none}

/* collapsed nav: same rule bodies fire from the .collapsed class or the narrow-viewport
   media query — CSS has no clean "media OR class" selector, so they're duplicated.
   section labels are removed outright, not shrunk to dividers: they'd still hold space. */
.nav.collapsed{inline-size:64px;flex:0 0 64px}
.nav.collapsed .logo-full,.nav.collapsed .gl,.nav.collapsed .item .label,
.nav.collapsed .nav-promo,.nav.collapsed .nav-profile .who,.nav.collapsed .nav-profile .icon{display:none}
.nav.collapsed .logo{justify-content:center;padding:0}
.nav.collapsed .logo-mark{display:block}
.nav.collapsed .item{justify-content:center;padding:0}
.nav.collapsed .nav-profile{justify-content:center}
.nav.collapsed .nav-scroll{overflow-x:hidden}
.nav.collapsed .nav-lang{background:transparent;padding:0;gap:0}
.nav.collapsed .nav-lang button:not(.on){display:none}
.nav.collapsed .nav-lang button.on{background:rgba(255,255,255,.09);color:#fff;block-size:32px}
.nav.collapsed .nav-lang .full{display:none}
.nav.collapsed .nav-lang .ic{display:block}
@media(max-width:1360px){
  .nav{inline-size:64px;flex:0 0 64px}
  .nav .logo-full,.nav .gl,.nav .item .label,.nav .nav-promo,.nav .nav-profile .who,.nav .nav-profile .icon{display:none}
  .nav .logo{justify-content:center;padding:0}
  .nav .logo-mark{display:block}
  .nav .item{justify-content:center;padding:0}
  .nav-profile{justify-content:center}
  .nav-scroll{overflow-x:hidden}
  .nav-lang{background:transparent;padding:0;gap:0}
  .nav-lang button:not(.on){display:none}
  .nav-lang button.on{background:rgba(255,255,255,.09);color:#fff;block-size:32px}
  .nav-lang .full{display:none}
  .nav-lang .ic{display:block}
}
#nav-flyout{position:fixed;z-index:70;transform:translateY(-50%);background:var(--nav);color:#fff;
  font-size:var(--fs-meta);line-height:var(--lh-meta);padding:var(--s1) var(--s2);border-radius:var(--r-sm);
  box-shadow:var(--shadow-md);pointer-events:none;white-space:nowrap}
.stack{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}

/* ── REGION 1 · spine. locked. never scrolls. ──────────────────── */
.spine{flex:0 0 auto;position:relative;z-index:5;background:var(--surface);border-block-end:1px solid var(--line);padding:var(--s3) var(--s4)}
.spine-row{display:flex;align-items:center;gap:var(--s6)}
.idb{display:flex;gap:var(--s3);min-width:0}
.avatar{inline-size:32px;block-size:32px;border-radius:50%;background:var(--sunken);color:var(--text2);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:var(--fs-meta);flex:0 0 auto}
.names{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.names .n2,.idline{font-size:var(--fs-meta);line-height:var(--lh-meta);color:var(--text2)}
.idline{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-block-start:var(--s1)}
.stats{display:flex;gap:var(--s6);margin-inline-start:auto;text-align:end;flex:0 0 auto}
.stat{flex:0 0 auto}
.stat .sub{font-size:var(--fs-meta);line-height:var(--lh-meta);color:var(--text2);display:block}
.badge{display:inline-flex;align-items:center;gap:var(--s1);block-size:20px;padding:0 var(--s2);border-radius:var(--r-sm);
  font-size:var(--fs-meta);line-height:var(--lh-meta);font-weight:600;white-space:nowrap}
.badge .dot{inline-size:6px;block-size:6px;border-radius:50%;background:currentColor}
.badge.q{background:var(--sunken);color:var(--text2)}
.badge.alert{background:var(--coralWash);color:var(--coralText)}
.badge.ok{background:var(--greenWash);color:var(--greenText)}
.badge.warn{background:var(--amberWash);color:var(--amberText)}
.badge.teal{background:var(--tealWash);color:var(--tealDeep)}

.band{margin-block-start:var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
.why{display:flex;align-items:center;gap:var(--s2);background:var(--coralWash);border-radius:var(--r-sm);padding:var(--s1) var(--s2)}
.why.calm{background:var(--sunken)}
.why .badge{padding:0}

.rail{display:flex;align-items:center;gap:var(--s2);margin-block-start:var(--s3);flex-wrap:wrap}
.rail .log-btn{margin-inline-start:auto}

/* ── REGIONS 2–4 · one column per scope ────────────────────────── */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:320px 480px minmax(340px,1fr)}
.cols.compare{grid-template-columns:320px 1fr}
.col{min-height:0;overflow:auto;border-inline-end:1px solid var(--line);scrollbar-width:thin;scrollbar-gutter:stable}
.col:last-child{border-inline-end:0}
/* fixed height so the three heads share one baseline whatever each one holds */
.colhead{position:sticky;top:0;z-index:4;background:var(--bg);block-size:44px;padding:0 var(--s3);
  border-block-end:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.colhead>.eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.colbody{padding:var(--s3) var(--s3) 32px}
.colbody.flush{padding:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);
  margin-block-end:var(--s2);cursor:pointer;position:relative}
.card:hover{border-color:var(--line2);box-shadow:var(--shadow-sm)}
.card.on{box-shadow:0 0 0 1px var(--teal),var(--shadow-sm)}
.card .kbd{position:absolute;inset-inline-end:var(--s2);inset-block-start:var(--s2);font-size:var(--fs-meta);line-height:var(--lh-meta);
  color:var(--text2);font-family:var(--mono)}
.card .flagdot{display:inline-block;inline-size:6px;block-size:6px;border-radius:50%;background:var(--coral);
  margin-inline-end:var(--s1);vertical-align:middle}
.card .reasoncue{margin-block-start:var(--s1);color:var(--coralDeep)}
.card-r{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);margin-block-start:var(--s1)}
.card-b{display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap;margin-block-start:var(--s2)}
.bar{block-size:4px;background:var(--sunken);border-radius:var(--r-sm);overflow:hidden;margin-block-start:var(--s2)}
.bar>i{display:block;block-size:100%;background:var(--teal)}

.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-block-end:var(--s2)}
.blk-h{padding:var(--s2) var(--s3);border-block-end:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.blk-b{padding:var(--s1) var(--s3) var(--s2)}
/* field row: label left, value right. the label never wraps (ellipsis + title as the
   last resort); values that hold prose are flagged wide at the call site so they get
   the full row instead of breaking onto three lines in a half-width cell. */
.rows .row{display:flex;align-items:baseline;gap:var(--s2);padding-block:var(--s1);border-block-end:1px solid var(--line-soft)}
.rows .row:last-child{border-block-end:0}
.row .k{flex:0 0 auto;max-inline-size:70%;font-size:var(--fs-meta);line-height:var(--lh-meta);color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:600;margin-inline-start:auto;text-align:end;flex:1;min-inline-size:0;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--s6)}
.grid2 .row.wide{grid-column:1/-1}
#c-bor .grid2{grid-template-columns:1fr}
.row.prose{display:block;padding-block:var(--s2);border-block-end:1px solid var(--line-soft)}
.hero{display:flex;gap:var(--s6);align-items:flex-start;padding-block-end:var(--s3);border-block-end:1px solid var(--line-soft);margin-block-end:var(--s1)}
.hero .stat{flex:1 1 0;min-inline-size:0}
.emptyline{color:var(--text2);font-size:var(--fs-meta);line-height:var(--lh-meta);padding-block:var(--s1)}

.tabs{display:inline-flex;background:var(--sunken);border-radius:var(--r-md);padding:2px;gap:2px}
.tabs button{border:0;background:transparent;font:inherit;font-size:var(--fs-meta);block-size:24px;padding:0 var(--s2);
  border-radius:var(--r-sm);color:var(--text2);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--text);font-weight:600}

.log{display:flex;gap:var(--s2);padding-block:var(--s2);border-block-end:1px solid var(--line-soft)}
.log::before{content:'';display:inline-block;inline-size:6px;block-size:6px;border-radius:50%;
  flex:0 0 auto;margin-block-start:7px}
.log.ai::before{background:var(--teal)}
.log.new{background:var(--tealWash)}
.log .when{flex:0 0 96px;color:var(--text2);font-size:var(--fs-meta)}
.log .meta{color:var(--text2);font-size:var(--fs-meta);line-height:var(--lh-meta)}

/* shared 180ms open animation for the wrap-up pane (CLAUDE.md: entry form open 180ms) */
@keyframes open{from{opacity:0;transform:translateY(-4px)}}

/* ── wrap-up screen ─────────────────────────────────────────────── */
.wrap{max-inline-size:480px;animation:open 180ms cubic-bezier(.23,1,.32,1)}
.wrap .f{display:flex;flex-direction:column;gap:var(--s1);margin-block-end:var(--s4)}
.wrap .f>span{font-size:var(--fs-meta);line-height:var(--lh-meta);color:var(--text2)}
.wrap .pair,.wrap .actions{display:flex;gap:var(--s2)}
.wrap .pair{align-items:flex-start}
.wrap .amt{max-inline-size:120px}
.wrap input{font:inherit;block-size:32px;padding:0 var(--s3);border:1px solid var(--ctl);
  border-radius:var(--r-md);background:var(--surface);color:var(--text)}
.wrap input::placeholder{color:var(--text2)}
.wrap input:hover{border-color:var(--text2)}
.wrap input:focus-visible,.dd-trigger:focus-visible,.dd-opt:focus-visible,.cal-day:focus-visible,.cal-nav:focus-visible{
  outline:none;box-shadow:var(--focus-ring)}

/* ── select + date picker (shadcn Select / Popover+Calendar). trigger = input metrics;
   popover = surface, hairline, md shadow, 4px inset; items 32px, radius sm. ── */
.dd{position:relative}
.dd-trigger{display:flex;align-items:center;gap:var(--s2);inline-size:100%;block-size:32px;padding:0 var(--s3);
  font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--ctl);border-radius:var(--r-md);
  cursor:pointer;text-align:start}
.dd-trigger .dd-val{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-trigger .icon{font-size:16px;color:var(--text2)}
.dd-trigger[aria-expanded="true"]{border-color:var(--teal)}
.dd-trigger.date{inline-size:200px}
.dd-trigger .empty-val{color:var(--text2)}
.dd-pop{position:absolute;z-index:20;inset-block-start:calc(100% + var(--s1));inset-inline-start:0;min-inline-size:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-md);padding:var(--s1)}
.dd-opt{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);block-size:32px;padding:0 var(--s2);
  border-radius:var(--r-sm);cursor:pointer}
.dd-opt:hover,.dd-opt:focus-visible{background:var(--sunken)}
.dd-opt .icon{font-size:16px;color:var(--tealDeep);visibility:hidden}
.dd-opt[aria-selected="true"]{font-weight:600}
.dd-opt[aria-selected="true"] .icon{visibility:visible}
.dd-pop.cal{min-inline-size:0;padding:var(--s3)}

.cal-day:hover{background:var(--sunken)}
.cal-day.today{background:var(--tealWash);color:var(--tealDeep);font-weight:600}

/* ── queue screen. one table: a single sticky header states each column's scope, so the
   rows don't repeat it. every non-text column is a fixed width so the numbers, contact
   counts and button sit on the same x in every row. ── */

.qhead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-block-end:var(--s4)}

.qrow,.qcols{display:grid;grid-template-columns:minmax(240px,1.4fr) minmax(260px,1.8fr) 140px 150px 96px 112px;
  align-items:center;column-gap:var(--s6);padding:var(--s3) var(--s4)}
.qcols{position:sticky;top:0;z-index:2;background:var(--sunken);border-block-end:1px solid var(--line);

.qrow-why .detail{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.icon{vertical-align:-0.15em;flex:0 0 auto;line-height:1}

/* ═══ 5.1 · icons — real Phosphor Icons (regular weight), loaded in index.html via
   unpkg. Replaces a hand-simplified inline-SVG set that didn't hold up at small sizes —
   this maps our short internal names to the library's actual icon slugs. ═══ */
const PH={phone:'phone',chat:'chat-circle',wa:'whatsapp-logo',mail:'envelope-simple',
 dash:'squares-four',users:'users',wallet:'wallet',chartbar:'chart-bar',robot:'robot',
 megaphone:'flag',flow:'flow-arrow',pencil:'pencil-simple',columns:'columns',
 timeline:'clock-countdown',ticket:'ticket',mic:'microphone',caret:'caret-down',
 dcaret:'caret-left',check:'check',lock:'lock-simple',inbox:'tray',
 calendar:'calendar-blank',prev:'caret-left',next:'caret-right'};
/* every icon here is decorative — the adjacent text/label always carries the meaning,
   so aria-hidden belongs on the shared atom, not repeated at each call site. */
function icon(name,cls){ return `<i class="ph ph-${PH[name]||name} icon${cls?' '+cls:''}" aria-hidden="true"></i>`; }

/* ═══ 5.2 · select + date picker, modelled on shadcn/ui's Select and Popover+Calendar.
   A hidden input carries the value, so forms read .value exactly as with a native
   control. Behaviour (open/close, keyboard, calendar grid) is wired in app.js. ═══ */
function selectMenu(id,opts,labelId){
 const [v0,l0]=opts[0];
 return `<div class="dd" data-dd="select">
  <input type="hidden" id="${id}" value="${v0}">
  <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${labelId} ${id}-v">
   <span class="dd-val" id="${id}-v">${esc(l0)}</span>${icon('caret')}</button>
  <div class="dd-pop" role="listbox" aria-labelledby="${labelId}" hidden>
   ${opts.map(([v,l],i)=>`<div class="dd-opt" role="option" tabindex="-1" data-v="${v}" aria-selected="${i===0}">
    <span>${esc(l)}</span>${icon('check')}</div>`).join('')}
  </div></div>`;
}
function datePicker(id,labelId){
 return `<div class="dd" data-dd="date">
  <input type="hidden" id="${id}">
  <button type="button" class="dd-trigger date" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="${labelId} ${id}-v">

}

/* ═══ 6 · REGION 1 · spine ═══ */
function spine(){
 const r=rec(),T_=t(),n=r.accts.length,w=worst(r),rs=reasons(r);
 const openAccts=r.accts.filter(a=>a.ptp&&a.ptp.state==='open');
 const openPtp=openAccts[0];
 const brokenN=r.accts.reduce((s,a)=>s+a.broken,0);
 /* T1: never a bare amount. multi-account records name the account + a count-across-accounts
    line in `sub`; single-account records keep the short date form. Always exactly
    eyebrow -> t-display -> sub, same shape as the other two spine stats, never a 3rd row. */
 const promise=openPtp
   ? (n>1
     ? `<div class="t-display">${M(openPtp.ptp.amt)}</div><span class="sub">${esc(T_.promiseAcross(openAccts.length,n))} · ${esc(E('product',openPtp.product))}</span>`
     : `<div class="t-display">${M(openPtp.ptp.amt)}</div><span class="sub">${esc(T_.promised)} ${D(openPtp.ptp.date)}${brokenN?` · ${esc(T_.brokenN(brokenN))}`:''}</span>`)
   : `<div class="t-display empty">${esc(T_.noPromise)}</div><span class="sub">${brokenN?esc(T_.brokenN(brokenN)):'&nbsp;'}</span>`;

 const chOff=k=>k==='review'||k==='dnc';
 const btn=(k,label,ic,pri,id)=>{
   const off=chOff(r.ch[k]);
   /* aria-disabled, not disabled: the button stays focusable and hoverable so the
      tooltip saying why can reach both mouse and keyboard users */
   return `<button ${id?`id="${id}" `:''}class="act${pri&&!off?' primary':''}${off?' off':''}"${off?` aria-disabled="true" data-tip="${esc(T_.ch[r.ch[k]])}"`:''}>
     ${icon(off?'lock':ic)}<span>${esc(label)}</span></button>`;
 };

 const band=rs.length
  ? `<div class="why" data-alert="1" data-g="why"><span class="badge alert"><i class="dot"></i>${esc(T_.why)}</span>
     <span><b>${esc(rs[0].x)}</b>${rs[1]?` ${esc(rs[1].x)}`:''}${rs.length>2?` <span class="dim">${esc(T_.more(rs.length-2))}</span>`:''}</span></div>`
  : `<div class="why calm" data-g="why"><span>${esc(T_.calm)}</span></div>`;

 return `<div class="spine">
  <div class="spine-row">
   <div class="idb">
    <div class="avatar">${esc(r.ini)}</div>
    <div>
     <div class="names" data-g="name"><span class="t-title">${esc(L(r.name))}</span>
      <span class="n2">${esc(S.lang==='en'?r.name.ar:r.name.en)}</span></div>
     <div class="idline">
      <span class="badge teal">${esc(E('stage',r.stage))}</span>
      <span>${esc(T_.f.lang)}: <b>${r.lang?esc(T_.langName[r.lang]):dash()}</b></span>
      <span>${esc(T_.f.owner)}: ${r.owner?esc(r.owner):dash()}</span>
     </div>
    </div>
   </div>
   <div class="stats">
    <div class="stat" data-g="out"><span class="eyebrow">${esc(T_.outstanding)}</span>
     <div class="t-display">${M(sumOut(r))}</div>
     <span class="sub">${esc(T_.across(n))} · ${esc(T_.original)} ${M(sumTot(r))}</span></div>
    <div class="stat" data-g="dpd"><span class="eyebrow">${esc(T_.worstDpd)}</span>
     <div class="t-display">${N(dpd(w))}</div>
     <span class="sub">${esc(T_.on)} ${esc(L(w.lender))} · ${esc(T_.asOf)} ${D(TODAY.toISOString())}</span></div>
    <div class="stat" data-g="ptp"><span class="eyebrow">${esc(T_.promise)}</span>
     ${promise}</div>
   </div>
  </div>
  <div class="band">
   ${band}
  </div>
  <div class="rail" data-g="rail">
   ${btn('call',T_.call,'phone',true)}${btn('sms',T_.sms,'chat')}${btn('wa',T_.wa,'wa')}${btn('email',T_.email,'mail')}
   ${btn('email',T_.emailInbox,'inbox',false,'b-inbox')}
   <!-- the post-call write lives with the other actions: the activity head can't hold
        four tabs, a scope toggle and this button at 1280–1440 without wrapping -->
   <button class="act log-btn" id="b-entry">${icon('pencil')}<span>${esc(T_.logOutcome)}</span></button>
  </div>
 </div>`;
}

 const r=rec(),T_=t(),h=hot(r),list=accts();
 const cards=list.map((a,i)=>{
  const flag=h.has(a.ref),p=Math.round((a.out/a.total)*100);
  /* T3: the card already spends one coral element on its status badge when disputed+flagged.
     the dot is a fallback, not an addition — it only fires when neither badge on this card
     is already carrying the coral for the same fact, so one alert is never marked twice. */
  const dotDue=flag&&a.status!=='disputed';
  return `<div class="card${i===S.sel?' on':''}${flag?' hot':''}" data-a="${i}" tabindex="0" role="button">
   ${i<9?`<span class="kbd">${i+1}</span>`:''}
   <div class="t-pri">${dotDue?'<i class="flagdot"></i>':''}${esc(L(a.lender))}</div>
   <div class="t-sec">${esc(E('product',a.product))} · ${ltr(a.ref)}</div>
   <div class="card-r"><span class="t-display sm">${M(a.out)}</span>
    <span class="t-sec">${esc(T_.of)} ${M(a.total)}</span></div>
   <div class="bar"><i style="inline-size:${p}%"></i></div>
   <div class="card-b">${statusBadge(a,flag)}${dpdBadge(a,flag&&a.status!=='disputed')}
    ${a.broken?`<span class="badge q">${esc(T_.brokenN(a.broken))}</span>`:''}
    ${a.plan?`<span class="badge ok">${M(a.plan.emi)}/${esc(T_.perMo)}</span>`:''}</div>
   ${dotDue?`<div class="t-sec reasoncue">${esc(T_.reasonCue)}</div>`:''}
  </div>`;
 }).join('');

 const c=r.calls||{};
 const contactHistory=(c.h||c.ai)?`<div class="rows grid2">
   ${row(T_.f.humanCalls,N(c.h))}${row(T_.f.aiCalls,N(c.ai))}
   ${row(T_.f.lastHuman,c.lastH?DT(c.lastH):null)}${row(T_.lastAi,c.lastAi?DT(c.lastAi):null)}
  </div>
  <div class="row prose">${c.ai_sum?esc(L(c.ai_sum)):`<span class="empty">${esc(T_.noAi)}</span>`}</div>`
  :`<div class="emptyline">${esc(T_.noContact)}</div>`;

 return `<div class="col" id="c-bor">
  <div class="colhead"><span class="eyebrow">${esc(T_.accounts)} · ${N(list.length)}</span>
   <button class="mini" id="b-compare">${esc(S.mode==='compare'?T_.back:T_.compare)}</button></div>
  <div class="colbody">
   ${cards}
   ${block('calls',contactHistory)}
   <!-- single-column on purpose: at 320px this column only has ~64px of label space, and
        labels like "Emirates ID" / "Date of birth" need close to that — a 2-column split
        would wrap them. Fields ordered narrow-first, wide-last so no row goes stranded. -->
   <div class="blk"><div class="blk-h"><span class="eyebrow">${esc(T_.reference)}</span></div>
    <div class="blk-b"><div class="rows">
     ${row(T_.f.dob,r.dob?D(r.dob):null)}
     ${row(T_.f.gender,r.gender?esc(E('gender',r.gender)):null)}
     ${row(T_.f.nat,r.nat?esc(r.nat):null)}
     ${row(T_.f.submit,r.submit?D(r.submit):null)}
     ${row(T_.f.phone,r.phone?ltr(r.phone,true):null)}
     ${row(T_.f.mail,r.mail?ltr(r.mail,true):null)}
     ${row(T_.f.visa,r.visa?esc(L(r.visa)):null)}
     ${row(T_.f.eid,r.eid?ltr(r.eid):null)}
    </div></div></div>
  </div></div>`;
}
/* ═══ 8 · REGION 3 · account column. fixed block order, no disclosure controls. ═══ */
function accountCol(){
 const a=acc(),T_=t(),d=dpd(a),p=Math.round((a.out/a.total)*100);

 const balance=block('balance',`
  <div class="hero">
   <div class="stat"><span class="eyebrow">${esc(T_.f.out)}</span>
    <div class="t-display">${M(a.out)}</div>
    <span class="sub">${N(p)}% ${esc(T_.of)} ${M(a.total)}</span>
    <div class="bar"><i style="inline-size:${p}%"></i></div></div>
   <div class="stat"><span class="eyebrow">${esc(T_.f.dpd)}</span>
    <div class="t-display">${N(d)}</div>
    <span class="sub">${esc(T_.asOf)} ${D(TODAY.toISOString())}</span></div>
  </div>
  <div class="rows grid2">
   ${row(T_.f.over,M(a.over))}${row(T_.f.due,D(a.due))}
   ${row(T_.f.principal,M(a.principal))}${row(T_.f.interest,a.interest?esc(a.interest):null)}
   ${row(T_.f.status,statusBadge(a,false))}${row(T_.f.product,esc(E('product',a.product)))}
   ${row(T_.f.lender,esc(L(a.lender)))}${row(T_.f.merchant,a.merchant?esc(L(a.merchant)):null)}
   ${row(T_.f.ref,ltr(a.ref))}${row(T_.f.acctRef,ltr(a.aref))}
  </div>`);

 const plan=block('plan',a.plan?`<div class="rows grid2">
   ${row(T_.f.emi,M(a.plan.emi))}${row(T_.f.next,D(a.plan.next))}
   ${row(T_.f.paid,`${N(a.plan.paid)} ${esc(T_.of)} ${N(a.plan.of)}`)}
   ${row(T_.f.flags,esc(L(a.plan.flags)),false,true)}
  </div><div class="bar plan"><i style="inline-size:${Math.round(a.plan.paid/a.plan.of*100)}%"></i></div>`
  :`<div class="emptyline">${esc(T_.noPlan)}</div>`);

 const promises=block('promises',(a.ptp||a.broken)?`<div class="rows grid2">
   ${row(T_.f.ptpAmt,a.ptp?M(a.ptp.amt):null)}${row(T_.f.ptpDate,a.ptp?D(a.ptp.date):null)}
   ${row(T_.f.ptpState,a.ptp?`<span class="badge ${a.ptp.state==='broken'?'q':'ok'}">${esc(E('ptp',a.ptp.state))}</span>`:null)}
   ${row(T_.f.broken,N(a.broken))}
   ${row(T_.f.brokenLast,a.brokenLast?D(a.brokenLast):null)}
   ${row(T_.f.brokenType,a.brokenType?esc(E('brokenType',a.brokenType)):null,false,true)}
  </div>`:`<div class="emptyline">${esc(T_.noPromise)}</div>`);

 const f=a.fields||{},fv=k=>f[k]===undefined?null:(f[k]==='yes'?esc(T_.yes):f[k]==='no'?esc(T_.no):esc(L(f[k])));
 const fields=block('fields',`<div class="rows grid2">
   ${row(T_.f.disputed,a.dispute?`<span class="badge q">${esc(T_.yes)}</span>`:esc(T_.no))}${row(T_.f.verif,fv('verif'))}
   ${row(T_.f.churn,fv('churn'))}${row(T_.f.repo,fv('repo'))}
   ${row(T_.f.hardship,fv('hardship'))}${row(T_.f.employer,fv('employer'))}
   ${row(T_.f.disputeWhy,a.dispute?esc(L(a.dispute.why)):null,false,true)}
   ${row(T_.f.settle,fv('settle'),false,true)}
  </div>`);

 const m=a.meta||{};
 const meta=block('meta',`<div class="rows grid2">
   ${row(T_.f.cby,esc(m.cby))}${row(T_.f.cat,D(m.cat))}
   ${row(T_.f.uby,esc(m.uby))}${row(T_.f.uat,D(m.uat))}
   ${row(T_.f.lenderId,ltr(a.lid),false,true)}
  </div>`);

 return `<div class="col" id="c-acc">
  <div class="colhead"><span class="eyebrow">${esc(T_.selected)} · ${esc(L(a.lender))} · ${esc(E('product',a.product))} · ${ltr(a.ref)}</span>${statusBadge(a,false)}</div>
  <div class="colbody">
   ${balance}${plan}${promises}${fields}${meta}
  </div></div>`;
}
/* ═══ 9 · REGION 4 · activity column + entry mode ═══ */
function activityCol(){
 const r=rec(),a=acc(),T_=t();
 const filt=l=>S.scope==='a'?l.filter(x=>x.a===a.ref):l;
 const tabs=[['i',T_.tab.i],['m',T_.tab.m],['t',T_.tab.t],['k',T_.tab.k]];

 let body='';
 if(S.tab==='i'||S.tab==='m'){
  const list=filt(S.tab==='i'?r.logs:r.msgs).sort((x,y)=>new Date(y.at)-new Date(x.at));
  body=list.length?list.map(x=>{
   const an=(r.accts.find(z=>z.ref===x.a)||{}).lender;
   const cls=x===S.justLogged?'new':(x.src==='ai'?'ai':'');
   return `<div class="log ${cls}"><span class="when num">${DT(x.at)}</span><span>
    <b class="t-pri">${esc(E('out',x.out))}</b>
    <span class="t-sec"> ${esc(E('src',x.src))} · ${esc(E('dir',x.dir))}</span>
    ${x.note?`<div>${esc(L(x.note))}</div>`:''}
    <div class="meta">${esc(x.by)}${S.scope==='all'&&an?` · ${esc(L(an))}`:''}</div></span></div>`;
  }).join(''):`<div class="emptyline">${esc(T_.noLogs)}</div>`;
 } else if(S.tab==='t'){
  body=r.time.length?r.time.map(x=>`<div class="log"><span class="when num">${D(x.at)}</span>
   <span>${esc(L(x.t))}</span></div>`).join(''):`<div class="emptyline">${esc(T_.noTimeline)}</div>`;
 } else body=`<div class="emptyline">${esc(T_.noTickets)}</div>`;

 /* the post-call write used to open inline here (S.entry). it's now its own screen
    (wrapupView, S.mode='wrapup') — same reasoning as before (the record must stay
    visible while transcribing), just given the room a sustained-attention task needs.
    "Log outcome" below is the one entry point into it. */
 return `<div class="col" id="c-act">
  <div class="colhead">
   <div class="tabs">${tabs.map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?'on':''}" data-gated="${S.tab===k?0:1}">${esc(l)}</button>`).join('')}</div>
   <button class="mini" id="b-scope">${esc(S.scope==='a'?T_.scopeAcct:T_.scopeAll)}</button>
  </div>
  <div class="colbody">
   ${body}
  </div></div>`;
}

/* ═══ 11 · SCREEN · queue. the case arrives here before any borrower record is open.
   Reuses the four existing records — no invented cases, no invented "time waited" field
   (none of the fixtures carry one, and fabricating it would be exactly the kind of
   unsourced number the defensibility pass exists to catch). ═══ */
function queueView(){
 const T_=t();
 /* sort: top escalation severity desc, then exposure desc — reuses reasons()'s own
    severity score, no new scoring logic. See spec.md's queue section for why. */
 const keys=Object.keys(R).sort((x,y)=>{
  const sx=reasons(R[x])[0]?.s||0, sy=reasons(R[y])[0]?.s||0;
  return sy!==sx ? sy-sx : sumOut(R[y])-sumOut(R[x]);
 });
 const flagged=keys.filter(k=>(reasons(R[k])[0]?.s||0)>0).length;
 const rows=keys.map(k=>{
  const r=R[k],rs=reasons(r),top=rs[0],w=worst(r);
  /* the badge names the reason's type (a triage column the agent scans without reading);
     the detail line carries the specifics. top-1 reason only: one coral badge per flagged
     row holds the fixtures at exactly 3, the existing budget cap (see spec.md). */
  const why=top
    ?`<div class="top"><span class="badge alert" data-alert="1"><i class="dot"></i>${esc(T_.rk[top.k])}</span>
      ${rs.length>1?`<span class="t-sec">${esc(T_.more(rs.length-1))}</span>`:''}</div>
     <span class="t-sec detail" title="${esc(top.x)}">${esc(top.d)}</span>`
    :`<span class="t-sec">${esc(T_.q.noFlag)}</span>`;
  return `<div class="qrow" data-q="${k}" tabindex="0" role="button">
   <div class="qrow-id">
    <div class="avatar">${esc(r.ini)}</div>
    <div class="who"><span class="t-title">${esc(L(r.name))}</span>
     <span class="t-sec">${esc(S.lang==='en'?r.name.ar:r.name.en)}</span></div>
   </div>
   <div class="qrow-why">${why}</div>
   <div class="qrow-num"><div class="t-display sm">${M(sumOut(r))}</div>
    <span class="t-sec">${esc(T_.across(r.accts.length))}</span></div>
   <div class="qrow-num"><div class="t-display sm">${N(dpd(w))}</div>
    <span class="t-sec">${esc(T_.on)} ${esc(L(w.lender))}</span></div>
   <div class="qrow-contact">${icon('robot')}<span class="num">${N(r.calls.ai)}</span>
    ${icon('phone')}<span class="num">${N(r.calls.h)}</span></div>
   <span class="mini pri" aria-hidden="true">${esc(T_.q.openCase)}</span>
  </div>`;
 }).join('');

 const c=T_.q.cols;
 return `<div class="queue">
  <div class="qhead">
   <span class="t-title">${esc(T_.q.title)} · ${esc(T_.q.count(keys.length))}</span>
   <span class="t-sec">${esc(T_.q.needsAttention(flagged))}</span>
  </div>
  <div class="qbody">
   <div class="qcols" aria-hidden="true"><span>${esc(c.who)}</span><span>${esc(c.why)}</span>
    <span class="n">${esc(T_.outstanding)}</span><span class="n">${esc(T_.worstDpd)}</span>
    <span class="n">${esc(c.calls)}</span><span></span></div>
   ${rows}
  </div>
 </div>`;
}

 }
 return `<div class="col"><div class="colhead">

  </div>

   <label class="f"><span>${esc(T_.notes)}</span>
    <input type="text" id="w-note"></label>
   <div class="f" role="group" aria-labelledby="w-ptp-l"><span id="w-ptp-l">${esc(T_.setPtp)}</span>
    <span class="pair">
     <input type="text" id="w-amt" class="amt" placeholder="AED" dir="ltr" aria-label="${esc(T_.f.ptpAmt)}">
     ${datePicker('w-date','w-ptp-l')}</span></div>
   <div class="wrap-note">${esc(T_.wrap.note)}</div>
   <div class="actions">
    <button class="act primary" id="w-save">${esc(T_.wrap.save)}</button>
    <button class="act" id="w-cancel">${esc(T_.cancel)}</button>
   </div>
  </div></div></div>`;
}

function nav(){
 const n=t().nav;
 const i=(k,ic,on,key)=>`<div class="item${on?' on':''}"${key?` data-nav="${key}" tabindex="0" role="button"`:''}>${icon(ic)}<span class="label">${esc(k)}</span></div>`;
 return `<div class="nav-scroll">
   <div class="logo">${LOGO}</div>
   <div class="gl">${esc(n.p)}</div>${i(n.dash,'dash')}${i(n.bor,'users',1,'queue')}${i(n.acc,'wallet')}
   <div class="gl">${esc(n.sup)}</div>${i(n.inbox,'mail')}${i(n.tick,'ticket')}
   <div class="gl">${esc(n.tools)}</div>${i(n.rep,'chartbar')}${i(n.ai,'robot')}${i(n.camp,'megaphone')}${i(n.wf,'flow')}
  </div>
  <div class="nav-bottom">
   <div class="nav-lang">
    <button data-v="en"${S.lang==='en'?' class="on"':''}><span class="full">English</span><span class="ic">EN</span></button>
    <button data-v="ar"${S.lang==='ar'?' class="on"':''}><span class="full">العربية</span><span class="ic">ع</span></button>
   </div>
   <div class="nav-promo">
    <div class="t-pri">${esc(n.voiceTitle)}</div>
    <div class="t-sec">${esc(n.voiceSub)}</div>
    <button class="nav-promo-btn">${icon('mic')}<span>${esc(n.voiceBtn)}</span></button>
   </div>
   <div class="nav-profile">
    <div class="avatar">S</div>
    <div class="who"><span class="t-pri">sara.haddad</span><span class="t-sec">sara.haddad@example.com</span></div>
    ${icon('caret')}
   </div>
  </div>
  <div class="nav-foot">
   <button id="b-navcollapse" title="${esc(S.navCollapsed?n.expand:n.collapse)}">${icon('dcaret')}</button>
  </div>`;
}

function render(){
 document.documentElement.lang=S.lang;
 document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 const list=accts(); if(S.sel>=list.length) S.sel=0;
 document.getElementById('nav').classList.toggle('collapsed',S.navCollapsed);
 document.getElementById('nav').innerHTML=nav();
 const stack=document.getElementById('stack');
 /* the only screen-swap mechanism the app has: a state field branched once, here.
    'queue' has no spine (no borrower is open yet); 'wrapup' reuses the exact
    two-column shape 'compare' already uses so the write pane keeps the spine and
    the account-card rail visible instead of introducing a second layout. */
 if(S.mode==='queue'){
  stack.innerHTML=queueView();
 } else if(S.mode==='wrapup'){
  stack.innerHTML=spine()+`<div class="cols compare">${borrowerCol()}${wrapupView()}</div>`;
 } else {
  stack.innerHTML=spine()+
   `<div class="cols${S.mode==='compare'?' compare':''}">${borrowerCol()}${S.mode==='compare'?compareView():accountCol()+activityCol()}</div>`;
 }
 wire();
}

/* default selection: the account the escalation line names, else the largest. */
function defaultSel(){
 const h=hot(rec()),list=accts();
 const i=list.findIndex(a=>h.has(a.ref));
 return i<0?0:i;
}
/* ═══ 13 · events ═══ */
/* product nav's own EN/AR toggle and the "Borrowers" -> queue link — #nav's innerHTML is
   replaced each render, so these listeners are delegated on the persistent container
   rather than rebound per render like wire(). */
document.getElementById('nav').addEventListener('click',e=>{
 const b=e.target.closest('.nav-lang button');
 if(b){
  /* collapsed rail only shows the active button (the inactive one is display:none),
     so clicking it must flip rather than re-set the same value or it would be a dead end.
     Expanded, both buttons are visible and clickable, so just set to whichever was
     clicked — flipping there too would make clicking the already-active language switch
     away from it, which is wrong for an ordinary two-button toggle. */
  const collapsed=document.getElementById('nav').classList.contains('collapsed');
  S.lang=collapsed?(S.lang==='en'?'ar':'en'):b.dataset.v; render(); return;
 }
 if(e.target.closest('[data-nav]')){ S.mode='queue'; render(); }
});
document.getElementById('nav').addEventListener('keydown',e=>{
 if(e.key!=='Enter'&&e.key!==' ')return;
 if(e.target.closest('[data-nav]')){ e.preventDefault(); S.mode='queue'; render(); }
});

/* keyboard: selection is a many-times-a-day action, so it gets no animation.
   digits/compare only act once a case is open, so a stray keystroke on the queue
   or mid-write on the wrap-up screen can't silently jump the agent somewhere else. */
document.addEventListener('keydown',e=>{
 if(e.target.matches('input,textarea,select'))return;
 const inCase=S.mode==='profile'||S.mode==='compare';
 const n=parseInt(e.key,10);
 if(inCase&&n>=1&&n<=9&&accts()[n-1]){S.sel=n-1;S.mode='profile';render();}
 if(inCase&&e.key==='c'){S.mode=S.mode==='compare'?'profile':'compare';render();}
 if(e.key==='q'&&S.mode!=='queue'&&S.mode!=='wrapup'){S.mode='queue';render();}
 if(e.key==='Escape'&&S.mode==='wrapup'){S.mode='profile';S.wrapDone=false;render();}
});

/* ═══ 13.1 · collapsed-nav hover flyout. one shared, fixed-position, JS-driven element.
   a per-item CSS :hover + position:absolute child was tried first and was invisible in
   practice: .nav-scroll{overflow:auto} silently clips any absolutely-positioned descendant
   that escapes its own bounds. position:fixed + JS placement sidesteps that entirely. ═══ */
function wireNavFlyout(){
 const fly=document.getElementById('nav-flyout'),navEl=document.getElementById('nav');
 if(!navEl.classList.contains('collapsed')){ fly.hidden=true; return; }
 navEl.querySelectorAll('.nav-scroll .item').forEach(el=>{
  el.addEventListener('mouseenter',()=>{
   const label=el.querySelector('.label'); if(!label)return;
   const r=el.getBoundingClientRect();
   fly.textContent=label.textContent;
   fly.style.top=r.top+r.height/2+'px';
   if(S.lang==='ar'){ fly.style.insetInlineEnd=(window.innerWidth-r.left)+'px'; fly.style.insetInlineStart='auto'; }
   else{ fly.style.insetInlineStart=r.right+'px'; fly.style.insetInlineEnd='auto'; }
   fly.hidden=false;
  });
  el.addEventListener('mouseleave',()=>{ fly.hidden=true; });
 });
}

function wire(){
 const s=document.getElementById('stack');
 s.querySelectorAll('[data-a]').forEach(el=>el.addEventListener('click',()=>{
  S.sel=+el.dataset.a;S.mode='profile';render();}));
 /* account cards carry role="button"+tabindex (regions.js) so Tab reaches them; the
    compare table's rows lean on their own real <button>, which is native-keyboard-safe
    already, so only the card-shaped targets need this explicit key handling. */
 s.querySelectorAll('[role="button"][data-a]').forEach(el=>el.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();S.sel=+el.dataset.a;S.mode='profile';render();}}));
 s.querySelectorAll('[data-q]').forEach(el=>{
  const open=()=>{S.rec=el.dataset.q;S.mode='profile';S.sel=defaultSel();render();};
  el.addEventListener('click',open);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
 });
 s.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.t;render();}));
 /* aria-disabled controls stay focusable (for their tooltip) but must never act */
 const on=(id,f)=>{const e=document.getElementById(id); if(e)e.addEventListener('click',ev=>{
  if(e.getAttribute('aria-disabled')!=='true')f(ev);});};
 on('b-compare',()=>{S.mode=S.mode==='compare'?'profile':'compare';render();});
 on('b-scope',()=>{S.scope=S.scope==='a'?'all':'a';render();});
 on('b-entry',()=>{S.mode='wrapup';S.wrapDone=false;render();});
 on('b-inbox',()=>{S.mode='profile';S.tab='m';S.scope='all';render();});
 on('w-cancel',()=>{S.mode='profile';render();});
 on('w-save',()=>{
  const a=acc(),r=rec();
  const out=document.getElementById('w-out').value;
  const note=document.getElementById('w-note').value.trim();
  const amt=parseFloat(document.getElementById('w-amt').value.replace(/[^\d.]/g,''));
  const date=document.getElementById('w-date').value;
  const entry={at:new Date().toISOString().slice(0,16),a:a.ref,src:'phone',dir:'out',out,
    by:r.owner||'Agent',note:note?{en:note,ar:note}:null};
  r.logs.unshift(entry); S.justLogged=entry;
  /* one write, three synchronised reads: spine stat, account card, this list */
  if(amt&&date){ a.ptp={amt,date,state:'open'}; }
  S.wrapDone=true; S.tab='i'; render();
 });
 on('w-return',()=>{S.wrapDone=false;S.mode='queue';render();});
 on('b-navcollapse',()=>{S.navCollapsed=!S.navCollapsed;render();});
 wireNavFlyout();
 s.querySelectorAll('.dd').forEach(wireDropdown);
}

/* ═══ 13.2 · select + date picker behaviour (markup: components.js 5.2).
   Popovers open instantly (CLAUDE.md motion), close on Escape / outside click / pick,
   and hand focus back to their trigger. ═══ */
const ISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function closeDropdowns(except){
 document.querySelectorAll('.dd-pop:not([hidden])').forEach(p=>{
  if(p.parentElement===except)return;
  p.hidden=true; p.parentElement.querySelector('.dd-trigger').setAttribute('aria-expanded','false');
 });
}
document.addEventListener('mousedown',e=>{ if(!e.target.closest('.dd')) closeDropdowns(); });

function wireDropdown(dd){
 const trig=dd.querySelector('.dd-trigger'),pop=dd.querySelector('.dd-pop'),input=dd.querySelector('input');
 const open=()=>{ closeDropdowns(dd); pop.hidden=false; trig.setAttribute('aria-expanded','true'); };
 const close=()=>{ pop.hidden=true; trig.setAttribute('aria-expanded','false'); trig.focus(); };
 /* stopPropagation: Escape here closes the popover only, not the whole wrap-up screen */
 pop.addEventListener('keydown',e=>{ if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();} if(e.key==='Tab')close(); });

 if(dd.dataset.dd==='select'){
  const opts=[...pop.querySelectorAll('.dd-opt')];
  const pick=o=>{ input.value=o.dataset.v; dd.querySelector('.dd-val').textContent=o.textContent.trim();
   opts.forEach(x=>x.setAttribute('aria-selected',x===o)); close(); };
  trig.addEventListener('click',()=>{ if(!pop.hidden){close();return;} open();
   (opts.find(o=>o.dataset.v===input.value)||opts[0]).focus(); });
  trig.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();trig.click();} });
  opts.forEach(o=>o.addEventListener('click',()=>pick(o)));
  pop.addEventListener('keydown',e=>{
   const i=opts.indexOf(document.activeElement),n=opts.length;
   const to={ArrowDown:(i+1)%n,ArrowUp:(i-1+n)%n,Home:0,End:n-1}[e.key];
   if(to!==undefined){e.preventDefault();opts[to].focus();}
   if((e.key==='Enter'||e.key===' ')&&i>=0){e.preventDefault();pick(opts[i]);}
  });
  return;
 }

 /* date: a month grid, weeks from Monday (UAE), past days not selectable —
    a promise to pay can only be made for today or later. */
 let view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
 const T_=t(),loc=S.lang==='ar'?'ar-AE-u-ca-gregory-nu-latn':'en-AE-u-ca-gregory';
 const monthF=new Intl.DateTimeFormat(loc,{month:'long',year:'numeric'});
 const dayF=new Intl.DateTimeFormat(loc,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const wk=Array.from({length:7},(_,i)=>new Intl.DateTimeFormat(loc,{weekday:S.lang==='ar'?'narrow':'short'})
   .format(new Date(2026,0,5+i))).map(w=>S.lang==='ar'?w:w.slice(0,2));
 const today=ISO(TODAY);
 const draw=focusIso=>{
  const y=view.getFullYear(),m=view.getMonth(),days=new Date(y,m+1,0).getDate(),lead=(new Date(y,m,1).getDay()+6)%7;
  const atStart=y===TODAY.getFullYear()&&m===TODAY.getMonth();
  const sel=input.value;
  const tgt=focusIso||(sel&&sel.slice(0,7)===ISO(view).slice(0,7)?sel:(atStart?today:ISO(view)));
  let cells='<span></span>'.repeat(lead);
  for(let d=1;d<=days;d++){
   const iso=ISO(new Date(y,m,d)),past=iso<today;
   cells+=past?`<span class="cal-day past" aria-hidden="true">${N(d)}</span>`
    :`<button type="button" class="cal-day${iso===today?' today':''}${iso===sel?' on':''}" data-d="${iso}"
       tabindex="${iso===tgt?0:-1}" aria-pressed="${iso===sel}" aria-label="${dayF.format(new Date(y,m,d))}">${N(d)}</button>`;
  }
  pop.innerHTML=`<div class="cal-head">
    <button type="button" class="cal-nav" data-m="-1"${atStart?` aria-disabled="true" data-tip="${esc(T_.noPast)}"`:''} aria-label="${esc(T_.prevMonth)}">${icon('prev')}</button>
    <span class="cal-cap" aria-live="polite">${esc(monthF.format(view))}</span>
    <button type="button" class="cal-nav" data-m="1" aria-label="${esc(T_.nextMonth)}">${icon('next')}</button></div>
   <div class="cal-grid" role="grid">${wk.map(w=>`<span class="cal-wd" aria-hidden="true">${esc(w)}</span>`).join('')}${cells}</div>`;
  const f=pop.querySelector(`[data-d="${tgt}"]`)||pop.querySelector('.cal-day[data-d]');
  if(f){f.tabIndex=0; if(focusIso!==null)f.focus();}
 };
 const shift=n=>{view=new Date(view.getFullYear(),view.getMonth()+n,1);};
 trig.addEventListener('click',()=>{ if(!pop.hidden){close();return;}
  if(input.value) view=new Date(+input.value.slice(0,4),+input.value.slice(5,7)-1,1);
  open(); draw(); });
 pop.addEventListener('click',e=>{
  const nav=e.target.closest('.cal-nav');
  if(nav){ if(nav.getAttribute('aria-disabled')!=='true'){shift(+nav.dataset.m);draw(null);
   pop.querySelector(`.cal-nav[data-m="${nav.dataset.m}"]`).focus();} return; }
  const b=e.target.closest('.cal-day[data-d]'); if(!b)return;
  input.value=b.dataset.d;
  const v=dd.querySelector('.dd-val'); v.textContent=D(b.dataset.d); v.classList.remove('empty-val');
  close();
 });
 pop.addEventListener('keydown',e=>{
  const b=e.target.closest('.cal-day[data-d]'); if(!b)return;
  const rtl=S.lang==='ar';
  const step={ArrowRight:rtl?-1:1,ArrowLeft:rtl?1:-1,ArrowDown:7,ArrowUp:-7}[e.key];
  if(step===undefined)return;
  e.preventDefault();
  const [y,m,d]=b.dataset.d.split('-').map(Number),n=new Date(y,m-1,d+step),iso=ISO(n);
  if(iso<today)return;
  if(n.getMonth()!==view.getMonth()) view=new Date(n.getFullYear(),n.getMonth(),1);
  draw(iso);
 });
}
S.sel=defaultSel();
render();
</script>
</body>
